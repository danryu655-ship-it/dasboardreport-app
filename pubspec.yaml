name: dasboardreport
description: "DasboardReport - Aplikasi keuangan pribadi (versi Android native, Flutter)."
publish_to: 'none'
version: 2.9.32+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  intl: ^0.20.1
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  supabase_flutter: ^2.9.0
  # OCR struk on-device (ML Kit Text Recognition v2, Latin, varian bundled:
  # model ter-link statis, offline sejak install, tanpa API key/server).
  # v0.16.0 = terakhir yang cocok Flutter 3.35.7 (0.17.x butuh Flutter 3.44+).
  google_mlkit_text_recognition: ^0.16.0
  file_picker: ^11.0.3
  xml: ^6.6.1
  archive: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Hanya untuk test: menjalankan sqflite di flutter test (VM) tanpa
  # platform channel. Tidak ikut ke APK (dev_dependency).
  sqflite_common_ffi: ^2.3.6

dependency_overrides:
  # pdf 3.12.0 membatasi archive <4.1.0, tapi image 4.11.0 (dipakai pdf)
  # memanggil ZLibDecoder.decodeLazy yang baru ada di archive >=4.5.0.
  # pdf 3.13.x memperbaiki batas ini tapi butuh Dart >=3.12, sementara
  # Flutter 3.35.7 (lokal & workflow) masih Dart 3.9.2 — jadi paksa
  # archive 4.6.0 sampai Flutter dinaikkan. Hapus override ini saat upgrade.
  archive: ^4.6.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon-192x192.png
    - assets/icon-512x512.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon-512x512.png"
  min_sdk_android: 21
